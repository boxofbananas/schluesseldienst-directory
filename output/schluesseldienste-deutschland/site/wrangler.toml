# Cloudflare Pages Konfiguration für die Formularannahme (functions/api/claim.ts).
# Die beiden Bindungen richtet Daniel in seinem Cloudflare-Konto ein; die IDs/Adressen hier
# ersetzen oder im Pages-Dashboard unter Settings → Functions → Bindings setzen.
# Siehe 05-build-report.md, Abschnitt „Was Daniels Cloudflare-Konto braucht".
name = "schluesseldienste-deutschland"
compatibility_date = "2026-11-04"
pages_build_output_dir = "dist"

# KV-Namespace für die Einsendungen. Anlegen:  npx wrangler kv namespace create EINSENDUNGEN
# Dann die ausgegebene id hier eintragen (oder im Dashboard als KV-Binding "EINSENDUNGEN" binden).
[[kv_namespaces]]
binding = "EINSENDUNGEN"
id = "31cfe34f7c08485c8708c642f0fc7781"

# Benachrichtigung bei Formulareingang. Pages unterstützt das send_email-Binding NICHT, kann also
# nicht selbst mailen. Der Versand läuft über den Worker notify-worker/ (send_email-Binding), den
# die Function per Service-Binding MAILER aufruft. Das Service-Binding setzt der Betreiber im
# Dashboard: Pages-Projekt → Settings → Functions → Service bindings → Name "MAILER" → Worker
# "schluesseldienste-claim-notify". (Service-Bindings stehen nicht in dieser Datei, damit der
# Pages-Deploy wie bei send_email nicht abgelehnt wird.)

# Absender läuft über die Verzeichnis-Domain und darf in der Config stehen.
[vars]
NOTIFY_FROM = "formular@die-besten-schluesseldienste.de"

# Empfänger (NOTIFY_TO) ist Daniels gewöhnliche Adresse und steht NICHT hier: Variablen aus dieser
# Datei überschreiben bei jedem Deploy den Dashboard-Wert, ein Secret dagegen überdauert Deploys und
# erscheint nie im Repo. Der Betreiber setzt es einmalig im eigenen Terminal:
#   npx wrangler pages secret put NOTIFY_TO --project-name=schluesseldienste-deutschland
# Wert: seine gewöhnliche Adresse, die zugleich in Email Routing als Destination verifiziert ist.
# Fehlt das Secret, wird nicht gemailt und die Einsendung steht allein in KV (functions/api/claim.ts).

# Service-Binding auf den Benachrichtigungs-Worker. Versuch, es aus der Config zu setzen statt
# im Dashboard (anders als send_email, das Pages hier ablehnt).
[[services]]
binding = "MAILER"
service = "schluesseldienste-claim-notify"
